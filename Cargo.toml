[package]
name = "tlg-rs-py"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/XuanRikka/tlg-rs-py"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "tlg"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["experimental-inspect", "pyo3-macros"] }
pyo3-file = "0.17.0"
tlg_core = { package = "tlg-rs", version = "1.1.0", default-features = false }

